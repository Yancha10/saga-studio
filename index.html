<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saga Studio</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Saga">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* ============ SAGA STUDIO · fine-art monochrome ============ */
:root{
  --bg:#0a0a0b; --rail:#0e0e10; --side:#101012; --panel:#151517; --panel2:#1c1c1f;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --ink:#f1f0ec; --mut:#8b8a90; --dim:#55545a;
  --acc:#f1f0ec; --accInk:#0a0a0b; --glow:rgba(241,240,236,.18);
  --ok:#9fd3a8; --warn:#d8c48a;
  --serif:"New York","Didot","Bodoni 72","Iowan Old Style",ui-serif,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
  --r:14px; --ease:cubic-bezier(.2,.8,.2,1);
}
:root[data-theme="light"]{
  --bg:#f3f2ee; --rail:#ebeae5; --side:#efeee9; --panel:#fbfaf7; --panel2:#f0efea;
  --line:rgba(0,0,0,.08); --line2:rgba(0,0,0,.18);
  --ink:#121214; --mut:#6f6e74; --dim:#a5a4a9;
  --acc:#121214; --accInk:#f3f2ee; --glow:rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;width:100%;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--line2)}
textarea{resize:vertical;min-height:74px;line-height:1.5}
img,video{display:block;max-width:100%}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
.lbl{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600}
.serif{font-family:var(--serif)}
.mut{color:var(--mut)}
.hide{display:none!important}

/* ---------- Header ---------- */
header{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);position:relative;z-index:20;background:var(--bg)}
.logo{font-family:var(--serif);font-size:15px;letter-spacing:.32em;display:flex;align-items:center;gap:10px;user-select:none}
.logo b{font-weight:600}.logo span{color:var(--mut);font-weight:400}
.logo .mark{width:16px;height:16px;border:1px solid var(--ink);position:relative;transform:rotate(45deg)}
.logo .mark:after{content:"";position:absolute;inset:4px;background:var(--ink)}
.hright{display:flex;align-items:center;gap:12px}
.pill{height:28px;padding:0 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;transition:.25s var(--ease)}
.pill:hover{border-color:var(--line2)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim)}.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.meter{font-size:10px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase;display:flex;gap:14px}
.meter b{color:var(--ink);font-weight:600;letter-spacing:.04em}
.iconbtn{width:30px;height:30px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;transition:.25s var(--ease)}
.iconbtn:hover{border-color:var(--line2);transform:rotate(-8deg)}
.avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--serif)}
.avatar img{width:100%;height:100%;object-fit:cover}

/* ---------- Main grid ---------- */
main{display:grid;grid-template-columns:88px 348px 1fr;height:calc(100vh - 42px)}
main.solo{grid-template-columns:88px 348px 1fr}
#nav{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 7px;gap:6px;overflow-y:auto}
.nb{width:74px;min-height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--mut);position:relative;transition:color .2s,background .3s var(--ease)}
.nb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.4;transition:transform .35s var(--ease)}
.nb:hover{color:var(--ink)}.nb:hover svg{transform:translateY(-2px) scale(1.06)}
.nb.on{background:var(--acc);color:var(--accInk)}
.nb.on:before{content:"";position:absolute;left:-7px;top:50%;width:3px;height:22px;margin-top:-11px;border-radius:2px;background:var(--acc)}
.nb .lock{position:absolute;top:5px;right:8px;font-size:8px;letter-spacing:0;opacity:.7}
.nb .count{position:absolute;top:4px;right:6px;min-width:15px;height:15px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:9px;display:grid;place-items:center;letter-spacing:0;padding:0 4px}
.nb.story{min-height:62px}
.nb .ring{width:38px;height:38px;border-radius:50%;padding:2px;border:1px solid currentColor;display:grid;place-items:center;overflow:hidden}
.nb .ring img,.nb .ring span{width:32px;height:32px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--panel2);font-family:var(--serif);font-size:14px;color:var(--ink)}
.navgroup{width:82px;border-radius:16px;padding:4px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px;align-items:center}
.navsep{width:40px;height:1px;background:var(--line);margin:6px 0}
.nb.more{min-height:24px;font-size:9px}

/* ---------- Side ---------- */
#side{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:22px 24px 40px;display:flex;flex-direction:column;gap:14px}
#stage{overflow-y:auto;position:relative;background:var(--bg)}

/* ---------- Buttons ---------- */
.btn{position:relative;overflow:hidden;height:38px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:var(--panel2);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .25s var(--ease),border-color .25s,background .25s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.acc{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.btn.acc:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .7s var(--ease)}
:root[data-theme="light"] .btn.acc:after{background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent)}
.btn.acc:hover:after{left:130%}
.btn.big{height:48px;width:100%;font-size:11.5px;letter-spacing:.22em}
.btn.wide{width:100%}
.btn.ghost{background:transparent}
.btn.sm{height:28px;padding:0 11px;font-size:9.5px;border-radius:9px}
/* corner-bracket hover (photographic frame) */
.frame{position:relative}
.frame:before,.frame:after{content:"";position:absolute;width:10px;height:10px;border:1px solid var(--ink);opacity:0;transition:.35s var(--ease);pointer-events:none;z-index:2}
.frame:before{top:6px;left:6px;border-right:0;border-bottom:0}
.frame:after{bottom:6px;right:6px;border-left:0;border-top:0}
.frame:hover:before,.frame.on:before{opacity:1;top:4px;left:4px}
.frame:hover:after,.frame.on:after{opacity:1;bottom:4px;right:4px}

/* segmented */
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);position:relative}
.seg button{height:24px;padding:0 14px;border-radius:999px;font-size:11px;font-weight:600;color:var(--mut);position:relative;z-index:1;transition:color .3s}
.seg button.on{color:var(--accInk)}
.seg .knob{position:absolute;top:3px;bottom:3px;border-radius:999px;background:var(--acc);transition:left .35s var(--ease),width .35s var(--ease)}
.sizes{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--panel2);border:1px solid var(--line)}
.sizes button{width:24px;height:22px;border-radius:999px;font-size:10px;font-weight:700;color:var(--mut)}
.sizes button.on{background:var(--ink);color:var(--bg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding:0 12px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:11.5px;display:inline-flex;align-items:center;gap:6px;transition:.2s}
.chip i{font-style:normal;color:var(--mut)}
.chip:hover{border-color:var(--line2)}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.chip.on i{color:var(--bg);opacity:.6}
.tag{height:22px;padding:0 9px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:10.5px;display:inline-flex;align-items:center;gap:6px}
.tag .x{opacity:.5;cursor:pointer}.tag .x:hover{opacity:1}

/* cards */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:10px}
.fold{border-top:1px solid var(--line);padding-top:12px}
.fold>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.fold>summary::-webkit-details-marker{display:none}
.fold>summary:after{content:"+";color:var(--mut);transition:transform .3s var(--ease)}
.fold[open]>summary:after{transform:rotate(45deg)}
.fold>div{padding-top:10px}

/* ---------- Profile card (side) ---------- */
.profhl{border-radius:18px;padding:16px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line2);display:flex;flex-direction:column;gap:16px;position:relative;overflow:hidden}
.profhl:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 31px,var(--line) 31px 32px);opacity:.35;pointer-events:none;mask:linear-gradient(180deg,#000,transparent 40%)}
.phead{display:flex;gap:14px;align-items:center;position:relative}
.bigav{width:76px;height:76px;border-radius:50%;border:1px solid var(--line2);padding:3px;flex:none;cursor:pointer;position:relative}
.bigav>div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--panel2);display:grid;place-items:center;font-family:var(--serif);font-size:28px}
.bigav img{width:100%;height:100%;object-fit:cover}
.bigav:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1px dashed var(--line2);animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pname{font-family:var(--serif);font-size:22px;line-height:1.1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative}
.stats>div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-family:var(--serif);font-size:18px;font-weight:400}
.dl{display:grid;grid-template-columns:76px 1fr;gap:7px 10px;font-size:12px;align-items:center}
.dl dt{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:600}
.dl dd input{padding:3px 6px;border-radius:6px;background:transparent;border-color:transparent}
.dl dd input:hover{border-color:var(--line)}
.dl dd input:focus{background:var(--panel2);border-color:var(--line2)}
.toggle{width:34px;height:20px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);position:relative;transition:.3s}
.toggle:after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--mut);transition:.3s var(--ease)}
.toggle.on{background:var(--ink)}.toggle.on:after{left:16px;background:var(--bg)}
.inline{background:transparent;border:1px dashed transparent;padding:4px 6px;border-radius:8px}
.inline:hover{border-color:var(--line2)}

/* ---------- Stage: perfil ---------- */
.pj{padding:28px 36px 60px;display:flex;flex-direction:column;gap:22px;max-width:1200px}
.creator{display:inline-flex;align-items:center;gap:8px;height:29px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:11px}
.circles{display:flex;gap:18px;flex-wrap:wrap}
.circ{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;width:68px;text-align:center;cursor:pointer}
.circ .c{width:58px;height:58px;border-radius:50%;padding:3px;border:1px solid var(--line2);transition:.35s var(--ease);position:relative}
.circ .c>div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--panel2);display:grid;place-items:center;font-family:var(--serif);font-size:20px}
.circ .c img{width:100%;height:100%;object-fit:cover}
.circ.on .c{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 4px var(--ink)}
.circ:hover .c{transform:translateY(-3px)}
.circ.add .c{border-style:dashed;display:grid;place-items:center;font-size:22px;color:var(--mut)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.tab{height:40px;padding:0 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;display:flex;align-items:center;gap:8px;transition:.25s var(--ease)}
.tab:hover{border-color:var(--line2)}
.tab.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.tab .soon,.soon{font-size:8.5px;letter-spacing:.18em;color:var(--dim);font-weight:600}
.tab svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5}
.h1{font-family:var(--serif);font-size:30px;font-weight:400;line-height:1.1}
.sheet{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:12px;padding:12px;border-radius:18px;border:1px solid var(--line2);background:var(--panel)}
.sheet .col{display:flex;flex-direction:column;gap:12px}
.slot{border-radius:14px;background:var(--panel2);border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.slot .ph{flex:1;min-height:120px;position:relative;display:grid;place-items:center;cursor:pointer;background:
  linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat,linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat}
.slot .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .ph .plus{width:42px;height:42px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;background:var(--panel);font-size:18px;transition:.3s var(--ease)}
.slot .ph:hover .plus{transform:scale(1.1) rotate(90deg)}
.slot .ph .edit{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);opacity:0;transition:.25s}
.slot .ph:hover .edit{opacity:1}
.slot .cap{padding:10px 12px;font-size:12px}.slot .cap b{display:block;font-weight:600}.slot .cap span{font-size:10.5px;color:var(--mut)}
.compgroup{border-radius:18px;padding:16px;border:1px solid var(--line2);background:var(--panel)}
.compgroup.drop{border-color:var(--ink);background:var(--panel2)}
.compgroup h4{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
.compgroup h4 span{letter-spacing:0;text-transform:none;font-weight:400;color:var(--mut);margin-left:8px}
.compgrid{display:flex;gap:12px;flex-wrap:wrap}
.comp{width:150px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);padding:8px;cursor:grab;transition:.25s var(--ease)}
.comp:hover{transform:translateY(-2px);border-color:var(--line2)}
.comp .im{aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg);display:grid;place-items:center;color:var(--dim);font-size:22px}
.comp .im img{width:100%;height:100%;object-fit:cover}
.comp b{display:block;font-size:12px;margin-top:7px}
.comp span{font-size:10px;color:var(--mut)}
.comp.add{display:flex;flex-direction:column;align-items:center;justify-content:center;border-style:dashed;cursor:pointer;min-height:180px;text-align:center}

/* ---------- Crear imagen (side) ---------- */
.charrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}
.charrow .av{width:34px;height:34px;border-radius:50%;overflow:hidden;background:var(--panel2);display:grid;place-items:center;font-family:var(--serif)}
.charrow .av img{width:100%;height:100%;object-fit:cover}
.addc{margin-left:auto;width:30px;height:30px;border-radius:50%;border:1px dashed var(--line2);display:grid;place-items:center;transition:.3s var(--ease)}
.addc:hover{transform:rotate(90deg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{min-width:0}
.tile{border-radius:12px;border:1px dashed var(--line2);padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.25s var(--ease);text-align:center;min-height:92px;justify-content:center}
.tile:hover{border-style:solid;border-color:var(--ink);transform:translateY(-1px)}
.tile.set{border-style:solid;background:var(--panel)}
.tile .ti{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--panel2);display:grid;place-items:center;border:1px solid var(--line)}
.tile .ti img{width:100%;height:100%;object-fit:cover}.tile .ti svg{width:18px;height:18px;stroke:var(--mut);fill:none;stroke-width:1.4}
.tile b{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase}
.tile span{font-size:10.5px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:11.5px;width:100%}
.bar .lbl{font-size:9.5px}
.bar.off{opacity:.5}
.dz{border-radius:14px;border:1px dashed var(--line2);padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.25s}
.dz:hover,.dz.over{border-color:var(--ink);background:var(--panel)}
.dz .ic{width:42px;height:42px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none;overflow:hidden}
.dz .ic img{width:100%;height:100%;object-fit:cover}
.dz b{font-size:12.5px}.dz p{font-size:11.5px;color:var(--mut)}
.dz a{font-size:11.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;height:32px}
.stepper button{width:30px;height:100%;color:var(--mut)}.stepper button:hover{color:var(--ink)}
.stepper b{min-width:22px;text-align:center}
.opts{display:flex;flex-direction:column;gap:4px;max-height:220px;overflow:auto}
.opt{display:flex;justify-content:space-between;padding:8px 10px;border-radius:9px;border:1px solid transparent;font-size:12px;text-align:left}
.opt:hover{background:var(--panel2)}.opt.on{border-color:var(--ink);background:var(--panel2)}
.opt span{color:var(--mut);font-size:11px}
.ratios{display:flex;gap:6px;flex-wrap:wrap}
.ratio{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;color:var(--mut);padding:5px;border-radius:8px;border:1px solid transparent}
.ratio i{display:block;border:1.5px solid currentColor;border-radius:2px}
.ratio.on{color:var(--ink);border-color:var(--line2)}
.prompt{font-family:var(--mono);font-size:11px;min-height:170px;line-height:1.6}
.refs{display:flex;gap:8px;flex-wrap:wrap}
.ref{width:52px;text-align:center;font-size:9px;font-family:var(--mono);color:var(--mut)}
.ref>div{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center}
.ref img{width:100%;height:100%;object-fit:cover}
.note{font-size:11.5px;color:var(--mut);line-height:1.55}
.sticky-gen{position:sticky;bottom:-40px;padding:14px 0 18px;background:linear-gradient(180deg,transparent,var(--side) 30%);margin-top:auto}

/* ---------- Stage: preview + gallery ---------- */
.preview{height:42vh;min-height:260px;border-bottom:1px solid var(--line);display:grid;place-items:center;position:relative;overflow:hidden;background:
  radial-gradient(circle at center,var(--panel) 0,var(--bg) 70%)}
.preview.black{background:#000}
.preview .pv{height:86%;aspect-ratio:3/4;border-radius:22px;border:1px solid var(--line2);padding:4px;background:var(--panel);box-shadow:0 30px 80px rgba(0,0,0,.45)}
.preview .pv img,.preview .pv video{width:100%;height:100%;object-fit:cover;border-radius:18px}
.preview .crosshair{position:absolute;inset:18px;pointer-events:none;border:1px solid var(--line)}
.preview .crosshair:before,.preview .crosshair:after{content:"";position:absolute;background:var(--line)}
.preview .crosshair:before{left:50%;top:0;bottom:0;width:1px}
.preview .crosshair:after{top:50%;left:0;right:0;height:1px}

.ghead{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px 10px;position:sticky;top:0;background:var(--bg);z-index:5}

.it{position:relative;aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:transform .35s var(--ease),border-color .25s;animation:rise .5s var(--ease) both}

.it .badge{position:absolute;top:7px;left:7px;height:20px;padding:0 7px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;display:flex;align-items:center;gap:4px;letter-spacing:.06em}
.it .play{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:grid;place-items:center;font-size:11px}

.emptystate{padding:60px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.emptystate .glyph{width:64px;height:64px;border:1px solid var(--line2);transform:rotate(45deg);display:grid;place-items:center;margin-bottom:12px}
.emptystate .glyph>i{width:20px;height:20px;background:var(--ink);transform:rotate(-45deg)}
.emptystate h3{font-family:var(--serif);font-size:24px;font-weight:400}
.emptystate p{color:var(--mut);max-width:380px}

/* creaciones: sub column */
.cre{display:grid;grid-template-columns:220px 1fr;min-height:100%}
.folders{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px}

.storage{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--mut)}

.storage i b{display:block;height:100%;background:var(--ink)}

/* detail aside */
.detimg{border-radius:16px;overflow:hidden;border:1px solid var(--line2);background:var(--panel);aspect-ratio:3/4}

.promptbox{font-family:var(--mono);font-size:11px;line-height:1.6;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;max-height:240px;overflow:auto;white-space:pre-wrap}
.swatches{display:flex;gap:6px;flex-wrap:wrap}

/* menu */
.menu{position:fixed;z-index:60;min-width:200px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .25s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}

.menu button[disabled]{opacity:.45;cursor:default}

/* modal */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;animation:fade .25s}
@keyframes fade{from{opacity:0}}
.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:24px;position:relative;animation:pop .3s var(--ease)}

.prov .btn{margin-left:auto}

/* floating */
#fab{position:fixed;right:22px;bottom:22px;width:52px;height:52px;border-radius:50%;background:var(--acc);color:var(--accInk);display:grid;place-items:center;z-index:30;box-shadow:0 10px 30px var(--glow);transition:.35s var(--ease)}
#fab:hover{transform:rotate(-12deg) scale(1.06)}
#fab:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--acc);opacity:.35;animation:pulse 2.6s infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.3);opacity:0}}
#fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:12px;z-index:99;transition:.35s var(--ease);pointer-events:none}

/* ---------- Mobile ---------- */

@media (max-width:720px){

  #fab{bottom:78px}
}

/* ===================== v3: color & marca ===================== */
:root{
  --c1:#ff8a5b; --c2:#ec4899; --c3:#8b5cf6;
  --grad:linear-gradient(120deg,var(--c1),var(--c2) 55%,var(--c3));
  --gradSoft:linear-gradient(120deg,rgba(255,138,91,.16),rgba(236,72,153,.14) 55%,rgba(139,92,246,.16));
  --hot:#ec4899; --hotLine:rgba(236,72,153,.55); --hotGlow:rgba(236,72,153,.28);
}
:root[data-theme="light"]{ --hot:#d61f7a; --hotLine:rgba(214,31,122,.5); --hotGlow:rgba(214,31,122,.18);
  --gradSoft:linear-gradient(120deg,rgba(255,138,91,.14),rgba(236,72,153,.12) 55%,rgba(139,92,246,.14)); }
::selection{background:rgba(236,72,153,.35)}
/* logo */
.logo{gap:11px;letter-spacing:0}
.logo .mark{width:28px;height:28px;border:0;transform:none;flex:none;filter:drop-shadow(0 4px 14px rgba(236,72,153,.35));transition:transform .5s var(--ease)}
.logo .mark:after{display:none}
.logo .mark svg{width:100%;height:100%;display:block}
.logo:hover .mark{transform:rotate(-8deg) scale(1.06)}
.logo .wm{display:flex;flex-direction:column;line-height:1;gap:3px}
.logo .wm b{font-family:var(--serif);font-size:16px;letter-spacing:.34em;font-weight:600;color:var(--ink)}
.logo .wm span{font-family:var(--sans);font-size:7.5px;letter-spacing:.62em;color:var(--mut);display:block;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
/* botón principal */
.btn.acc{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 24px -10px var(--hotGlow),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.acc:hover{border-color:transparent;box-shadow:0 12px 30px -10px rgba(236,72,153,.55),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:hover{border-color:var(--hotLine)}
/* navegación */
.nb.on{background:var(--gradSoft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--hotLine)}
.nb.on svg{stroke:var(--hot)}
.nb.on:before{background:var(--grad);width:3px}
.nb .count{background:var(--grad);color:#fff}
.nb .ring{border:0;background:var(--grad);padding:2px}
.nb .ring img,.nb .ring span{border:2px solid var(--rail)}
#mnav .nb.on{background:var(--gradSoft)}
/* controles */
.seg .knob{background:var(--grad);box-shadow:0 4px 14px -6px var(--hotGlow)}
.seg button.on{color:#fff}
.chip.on{background:var(--gradSoft);color:var(--ink);border-color:var(--hotLine)}
.chip.on i{color:var(--hot);opacity:1}
.toggle.on{background:var(--grad);border-color:transparent}.toggle.on:after{background:#fff}
.opt.on{border-color:var(--hotLine);background:var(--gradSoft);box-shadow:inset 3px 0 0 var(--hot)}
.opt.dis{opacity:.42;cursor:not-allowed}.opt.dis:hover{background:none}
.ratio.on{color:var(--hot);border-color:var(--hotLine);background:var(--gradSoft)}
.tile:hover{border-color:var(--hotLine)}
.tile.set{border-color:var(--hotLine);background:var(--gradSoft)}
.tile.set .ti{border-color:var(--hot)}
.tile.nsfwoff{opacity:.45;border-style:dashed;filter:grayscale(1)}
input:focus,textarea:focus,select:focus{border-color:var(--hotLine);box-shadow:0 0 0 3px rgba(236,72,153,.12)}
.promptwrap mark{background:rgba(236,72,153,.22)}
.menu button.on{box-shadow:inset 2px 0 0 var(--hot)}
.dot.on{background:#3ddc97;box-shadow:0 0 8px #3ddc97}
.lnk:hover{color:var(--hot)}
.stepper button:hover{color:var(--hot)}
.gstep.now i{background:var(--grad);color:#fff;border-color:transparent}
/* interruptor del menú */
.msw{width:30px;height:18px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);position:relative;flex:none;transition:.3s}
.msw:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--mut);transition:.3s var(--ease)}
.menu button.on .msw{background:var(--grad);border-color:transparent}.menu button.on .msw:after{left:14px;background:#fff}
/* 🔥 */
.nsfwdot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;flex:none;transition:.25s var(--ease);font-size:15px;line-height:1}
.nsfwdot i{width:6px;height:6px;border-radius:50%;background:var(--mut)}
.nsfwdot:hover{border-color:var(--hotLine);transform:scale(1.06)}
.nsfwdot.on{border-color:transparent;background:linear-gradient(140deg,#ff9f43,#ff4d4d 60%,#e11d74);box-shadow:0 0 0 3px rgba(255,77,77,.18),0 6px 18px -6px rgba(255,77,77,.6);animation:flame 2.4s ease-in-out infinite}
@keyframes flame{0%,100%{box-shadow:0 0 0 3px rgba(255,77,77,.18),0 6px 18px -6px rgba(255,77,77,.6)}50%{box-shadow:0 0 0 5px rgba(255,77,77,.10),0 8px 22px -6px rgba(255,120,60,.75)}}
@media (prefers-reduced-motion:reduce){.nsfwdot.on{animation:none}}
/* tablet / ventana estrecha: se mantiene el escritorio, más compacto */
@media (min-width:721px) and (max-width:1180px){
  main{grid-template-columns:70px 300px 1fr}

function restoreTrash(id) {

/* ---------- sincronizar: datos (el más reciente gana; si los dos cambiaron, te pregunto) + archivos que falten a cada lado ---------- */
async function gdSync(opts = {}) {

  GD.busy = true; gdSet('sync');
  try {
    if (!GD.folder) { GD.folder = await gdFolder('Saga Studio'); GD.media = await gdFolder('archivos', GD.folder); gdMetaSave(); }
    // 1) datos
    const rf = await gdFind('saga-studio-datos.json', GD.folder);
    const local = syncedState(); const lh = hash(JSON.stringify(local));
    const lastSync = S.drive.syncAt || 0; const localChanged = lh !== S.drive.hash;
    if (rf) { GD.stateId = rf.id; const rt = Date.parse(rf.modifiedTime);
      if (rt > lastSync + 1000) { // alguien (otro dispositivo) guardó después de mi última sincronización
        let take = true;
        if (localChanged && lastSync) take = await ask('Tu Drive tiene cambios de otro dispositivo y aquí también has cambiado cosas.\n\n¿Me quedo con lo del Drive? (Si dices que no, se guarda lo de este dispositivo encima.)');
        else if (localChanged && !lastSync && S.creaciones.length) take = await ask('Ya tienes datos de Saga Studio en tu Drive.\n\n¿Los cargo aquí? (Si dices que no, se guarda lo de este dispositivo encima del Drive.)');
        if (take) { const remote = await gdJson(`${GD.API}/files/${rf.id}?alt=media`); const keep = {}; DEVICE_KEYS.forEach(k => keep[k] = S[k]);
          S = Object.assign(defaultState(), remote, keep); seedCatalog(); (S.libs.vestidor || []).forEach(x => { if (x.look !== undefined) { if (x.img && (x.img === x.look || /-look\.jpg$/.test(x.img))) x.img = ''; delete x.look; } }); S.drive.syncAt = rt; S.drive.hash = hash(JSON.stringify(syncedState())); localStorage.setItem(KEY, JSON.stringify(S)); render(); toast('Cargado desde tu Drive'); }
        else await gdPushState(true);
      } else if (localChanged) await gdPushState(true);
    } else await gdPushState(true);
    // 2) archivos: subir los que no estén, bajar los que falten aquí
    const list = []; let page = '';
    do { const j = await gdJson(`${GD.API}/files?q=${gq(`'${GD.media}' in parents and trashed=false`)}&fields=nextPageToken,files(id,appProperties)&pageSize=1000${page ? '&pageToken=' + page : ''}`); list.push(...j.files); page = j.nextPageToken; } while (page);
    GD.remote = {}; list.forEach(f => { const k = f.appProperties && f.appProperties.sagaId; if (k) GD.remote[k] = f.id; }); gdMetaSave();
    const keys = await idbKeys(); const up = keys.filter(k => !GD.remote[k]);
    const used = new Set(JSON.stringify(S).match(/m:[a-z0-9]+/g) || []); const down = [...used].filter(k => !keys.includes(k) && GD.remote[k]);
    let n = 0; const tot = up.length + down.length;
    for (const k of up) { const b = await idbGet(k); if (!b) continue; gdSet('sync', `Subiendo ${++n} de ${tot}…`); const f = await gdUpload({ name: k.replace(':', '_') + '.' + extOf(b.type), parents: [GD.media], appProperties: { sagaId: k } }, b); GD.remote[k] = f.id; gdMetaSave(); }
    for (const k of down) { gdSet('sync', `Bajando ${++n} de ${tot}…`); const b = await (await gdFetch(`${GD.API}/files/${GD.remote[k]}?alt=media`)).blob(); if (db) await idbPut(k, b); urls[k] = URL.createObjectURL(b); }
    if (down.length) render();
    S.drive.last = Date.now(); localStorage.setItem(KEY, JSON.stringify(S));
    gdSet('ok', 'Todo guardado en tu Drive · ' + new Date().toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }));
    if (opts.toast) toast(tot ? `Drive al día · ${up.length} subidos, ${down.length} bajados` : 'Drive al día');
  } catch (e) { if (e.need) { gdSet('need'); GD.wantGesture = true; } else { console.warn(e); gdSet('err', e.message); if (opts.toast) toast('Drive: ' + e.message); } }

}
async function gdPushState(force) {
  const local = syncedState(); const h = hash(JSON.stringify(local)); if (!force && h === S.drive.hash) return;
  const blob = new Blob([JSON.stringify(local)], { type: 'application/json' });

  GD.stateId = f.id; gdMetaSave(); S.drive.hash = h; S.drive.syncAt = Date.parse(f.modifiedTime) || Date.now(); localStorage.setItem(KEY, JSON.stringify(S));

  if (t.closest('#fbw') && t.classList.contains('fbta')) { F.texto = t.value; const b = $('#fbw [data-a="fbSend"]'); if (b) b.disabled = !(F.texto.trim() || F.audio || F.archivos.length); return; }
  if (t.dataset.f) { char()[t.dataset.f] = t.value; S.img.prompt = ''; save(); if (['name','handle','age'].includes(t.dataset.f)) { clearTimeout(t._r); t._r = setTimeout(() => { const pos = t.selectionStart; const f = t.dataset.f; render(); const n = $(`#side [data-f="${f}"]`); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 700); } return; }
  if (t.hasAttribute('data-imgprompt')) { S.img.prompt = t.value; syncHl(t); save(); return; }
  if (t.hasAttribute('data-imgidea')) { S.img.idea = t.value; S.img.prompt = ''; save(); return; }
  if (t.hasAttribute('data-vextra')) { S.vid.extra = t.value; save(); return; }
  if (t.hasAttribute('data-vaccion')) { S.vid.accion = t.value; save(); return; }
  if (t.dataset.af) { S.aud[t.dataset.af] = t.value; save(); return; }
  if (t.dataset.arange) { S.aud[t.dataset.arange] = +t.value; save(); const b = t.parentElement.querySelector('b'); if (b) b.textContent = t.value; return; }
  if (t.hasAttribute('data-q')) { S.q = t.value; clearTimeout(t._r); t._r = setTimeout(() => { render(); const n = $('[data-q]'); n.focus(); n.setSelectionRange(S.q.length, S.q.length); }, 250); return; }
  if (t.dataset.refprompt) { const k = t.dataset.refprompt; const p = S[k].find(x => x.id === S.picked[k]); if (p) { p.prompt = t.value; save(); } return; }
  if (t.dataset.refmodel) { const k = t.dataset.refmodel; const p = S[k].find(x => x.id === S.picked[k]); if (p) { p.model = t.value; save(); } return; }
  if (t.dataset.libf) { const [lib, p] = curLib(); if (p) { p[t.dataset.libf] = t.value; save(); } return; }
  if (t.dataset.wzf) { const d = char().wiz.d; d[t.dataset.wzf] = t.value; if (t.dataset.wzf === 'prompt') d.promptManual = true; save(); return; }
  if (t.dataset.wzrange) { const d = char().wiz.d; d[t.dataset.wzrange] = +t.value; const b = t.parentElement.querySelector('b'); if (b) b.textContent = t.dataset.wzrange === 'altura' ? (t.value / 100).toFixed(2).replace('.', ',') + ' m' : t.value + ' años'; save(); return; }
});
document.addEventListener('scroll', e => { if (e.target.matches && e.target.matches('[data-imgprompt]')) syncHl(e.target); }, true);
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.refcat) { const k = t.dataset.refcat; const p = S[k].find(x => x.id === S.picked[k]); if (p) { p.cat = t.value; save(); render(); } }
  if (t.dataset.refesc) { const k = t.dataset.refesc; const p = S[k].find(x => x.id === S.picked[k]); if (p) { p.escena = t.value; save(); } }
  if (t.dataset.libf === 'cat') render();
  if (t.hasAttribute('data-vaudio')) { S.vid.audio = t.checked; save(); }
  if (t.dataset.acheck) { S.aud[t.dataset.acheck] = t.checked; save(); }
  if (t.dataset.wzsel) { char().wiz.d[t.dataset.wzsel] = t.value; char().wiz.d.promptManual = false; save(); }
});
/* arrastrar y soltar */
document.addEventListener('dragstart', e => { const c = e.target.closest?.('[data-comp]'); if (c) e.dataTransfer.setData('text/comp', c.dataset.comp); });
document.addEventListener('dragover', e => { const z = e.target.closest?.('[data-dropg],[data-drop],#stage,#side'); if (z) { e.preventDefault(); z.matches('[data-dropg]') && z.classList.add('drop'); z.matches('[data-drop]') && z.classList.add('over'); } });
document.addEventListener('dragleave', e => { const z = e.target.closest?.('[data-dropg],[data-drop]'); z && z.classList.remove('drop', 'over'); });
document.addEventListener('drop', async e => {
  if (e.target.closest?.('#scrim')) return;
  const zg = e.target.closest?.('[data-dropg]'); const cid = e.dataTransfer.getData('text/comp');
  if (zg && cid) { e.preventDefault(); const x = char().comps.find(y => y.id === cid); if (x) x.group = zg.dataset.dropg; save(); return render(); }
  const fs = [...(e.dataTransfer.files || [])]; if (!fs.length) return; e.preventDefault();
  const tgt = e.target.closest?.('[data-drop]')?.dataset.drop || '';
  if (tgt === 'copyRef' || (S.section === 'crear' && e.target.closest?.('#side'))) { S.copyRef = await putMedia(fs[0]); S.img.prompt = ''; save(); return render(); }
  if (tgt.startsWith('lib:')) return addToRefLib(tgt.slice(4), fs);
  if (tgt.startsWith('libitem:')) return addToLib(tgt.slice(8), fs);
  if (S.section === 'biblio') return addToRefLib('fototeca', fs);
  if (S.section === 'videoteca') return addToRefLib('filmoteca', fs);
  if (S.section.startsWith('lib:')) return addToLib(S.section.slice(4), fs);
  if (S.section === 'audio') return importAudioModal('');
  if (['crear','video','creaciones'].includes(S.section)) return importResultModal(S.section === 'video' ? 'vid' : 'img');
});
document.addEventListener('toggle', e => { const d = e.target; if (d.matches && d.matches('details[data-sec]')) { S.open = S.open || {}; S.open[d.dataset.sec] = d.open; save(); } }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); closeMenu(); if (F.open) { F.open = false; fbStop(); paintFb(); } } });
window.addEventListener('resize', () => $$('.seg').forEach(placeKnob));

/* ---------- arranque ---------- */
(async () => {
  try { db = await idb(); await loadAllMedia(); } catch (e) { console.warn('IndexedDB no disponible', e); }
  const h = location.hash.slice(1).replace('-', ':');
  if (h && (R[h] || (h.startsWith('lib:') && LIBS[h.slice(4)]))) S.section = h;
  if (S.section.startsWith('lib:') && !LIBS[S.section.slice(4)]) S.section = 'perfil';
  render(); paintFb(); save();
  if (!S.bienvenidaVista) setTimeout(bienvenidaModal, 400);
  autoVestidor();
  if (gdOn()) { gdSet(gdOk() ? 'sync' : 'need'); gdSync(); }
})();
/* iPhone con la app instalada: a veces iOS deja un hueco bajo los elementos fijos. Lo medimos y lo compensamos. */
function fixBottomGap() {
  try {
    const st = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
    if (!st || innerWidth > 720 || innerWidth > innerHeight) { document.documentElement.style.setProperty('--gapB', '0px'); return; }
    const pr = document.createElement('div'); pr.style.cssText = 'position:fixed;left:0;bottom:0;width:1px;height:1px;pointer-events:none;visibility:hidden';
    document.body.appendChild(pr); const b = pr.getBoundingClientRect().bottom; pr.remove();
    const gap = Math.round(screen.height - b); document.documentElement.style.setProperty('--gapB', (gap > 0 && gap < 160 ? gap : 0) + 'px');
  } catch (e) {}
}
['load', 'resize', 'orientationchange', 'pageshow'].forEach(ev => addEventListener(ev, () => setTimeout(fixBottomGap, 60)));
document.addEventListener('visibilitychange', () => setTimeout(fixBottomGap, 60));
fixBottomGap();
